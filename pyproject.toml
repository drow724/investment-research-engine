[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investment-research-engine"
version = "0.6.0"
description = "Point-in-time investment research and crypto trading foundations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "polars>=1.17,<2",
  "pyarrow>=18,<22",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/investment"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["investment"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
