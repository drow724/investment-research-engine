services:
  investment-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: investment-research-engine:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./runtime:/app/runtime
      - ./experiments:/app/experiments
      - ./models:/app/models
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
